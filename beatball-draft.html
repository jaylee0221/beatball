<!doctype html>
<meta charset="utf-8">
<title>BeatBall — Draft Board (wired skeleton)</title>
<style>
  body{ font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; max-width:900px; margin:20px auto;
        padding:0 16px; color:#111; background:#fafafa; }
  h1{ font-size:16px; } h2{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#777; margin:0 0 6px; }
  .banner{ background:#fff8e1; border-left:3px solid #e6c200; padding:6px 10px; margin:8px 0; font-size:12px; }
  .board{ border:1px solid #ccc; border-radius:6px; padding:10px; background:#fff; margin:8px 0; }
  .board.active{ border-color:#0a7; box-shadow:0 0 0 2px #0a733; }
  .board .head{ display:flex; justify-content:space-between; align-items:baseline; }
  .slots{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:6px; }
  .slot{ border:1px dashed #bbb; border-radius:4px; padding:6px; min-height:46px; font-size:12px; }
  .slot .pos{ color:#999; font-size:10px; text-transform:uppercase; }
  .slot.filled{ border-style:solid; border-color:#333; background:#f4f4f4; }
  .slot.target{ border-color:#0a7; cursor:pointer; background:#eafaf3; }
  .slot.target.cant{ border-color:#c33; background:#fdecec; cursor:not-allowed; color:#c33; }
  .slot .val{ font-weight:700; } .slot .price{ color:#0a7; }
  .center{ border:2px solid #333; border-radius:8px; padding:12px; background:#fff; margin:10px 0; }
  .roster{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:8px; }
  .card{ border:1px solid #ccc; border-radius:5px; padding:8px; cursor:pointer; background:#fff; }
  .card:hover{ border-color:#333; } .card.sel{ border-color:#0a7; box-shadow:0 0 0 2px #0a733; }
  .card.taken{ opacity:.35; text-decoration:line-through; cursor:not-allowed; }
  .card .nm{ font-weight:700; font-size:12px; } .card .el{ color:#999; font-size:10px; }
  .card .pr{ color:#0a7; font-weight:700; } .card .st{ color:#666; font-size:10px; margin-top:3px; }
  .turn{ font-size:14px; font-weight:700; } .turn .you{ color:#0a7; } .turn .opp{ color:#b26b00; }
  button{ font:12px ui-monospace; padding:6px 14px; cursor:pointer; border:1px solid #333;
          background:#111; color:#fff; border-radius:4px; }
  button:disabled{ opacity:.4; cursor:default; }
  .result{ font-size:20px; margin:10px 0; } .bud{ color:#0a7; font-weight:700; }
</style>
<h1>BeatBall — Draft Board <small style="color:#999">(wired skeleton — your design goes on top)</small></h1>
<div class="banner"><b>Reaction surface.</b> Structure + engine only, zero visual design. Hot-seat: you pick for
both sides (watch the turn label). The point to feel: the <b>penalty preview</b> on your open slots when a
player is selected. Tear the layout apart.</div>

<div id="app"></div>

<script>
// ================= ENGINE (your tuned build) =================
const WEIGHTS = { pts:0.2, tpm:0.1, reb:0.1, ast:0.2, stl:0.118, blk:0.118, fg:0.045, to:0.118 };
const ANCHORS = { pts:{elite:28,repl:6}, tpm:{elite:3,repl:0}, reb:{elite:12,repl:2}, ast:{elite:9,repl:1},
  stl:{elite:2,repl:.4}, blk:{elite:2.2,repl:.2}, fg:{elite:.56,repl:.4}, to:{elite:1,repl:4} };
const SLOT_INDEX = { PG:1, SG:2, SF:3, PF:4, C:5 };
const PENALTY = [1,.8,.6,.4,.25];
const norm=(v,a)=>Math.max(0,Math.min(1,(v-a.repl)/(a.elite-a.repl)));
function baseStrength(p){ let s=0; for(const k in WEIGHTS) s+=WEIGHTS[k]*norm(p[k],ANCHORS[k]); return s; }
const dist=(p,slot)=>Math.min(...p.eligible.map(e=>Math.abs(SLOT_INDEX[e]-SLOT_INDEX[slot])));
const placed=(p,slot)=>baseStrength(p)*PENALTY[dist(p,slot)];
const price=p=>Math.round(baseStrength(p)*100);

// ================= DATA =================
// 2015-16 Cavs = real verified. Others = PLACEHOLDER approximate fixtures (swap in real data).
const ROSTERS = [
  { team:'2015-16 Cavaliers', players:[
    {id:'lebron',name:'LeBron James',pts:25.3,tpm:1.1,reb:7.4,ast:6.8,stl:1.4,blk:.6,fg:.520,to:3.3,eligible:['SF','PF']},
    {id:'kyrie',name:'Kyrie Irving',pts:19.6,tpm:1.6,reb:3.0,ast:4.7,stl:1.1,blk:.3,fg:.448,to:2.3,eligible:['PG']},
    {id:'love',name:'Kevin Love',pts:16.0,tpm:2.1,reb:9.9,ast:2.4,stl:.8,blk:.5,fg:.419,to:1.8,eligible:['PF','C']},
    {id:'jrsmith',name:'J.R. Smith',pts:12.4,tpm:2.6,reb:2.8,ast:1.7,stl:1.1,blk:.3,fg:.415,to:.8,eligible:['SG']},
    {id:'thompson',name:'Tristan Thompson',pts:7.8,tpm:0,reb:9.0,ast:.8,stl:.5,blk:.6,fg:.588,to:.7,eligible:['C']} ]},
  { team:'2016-17 Warriors ~', players:[
    {id:'curry',name:'Stephen Curry',pts:25.3,tpm:4.1,reb:4.5,ast:6.6,stl:1.8,blk:.2,fg:.468,to:3.0,eligible:['PG','SG']},
    {id:'klay',name:'Klay Thompson',pts:22.3,tpm:3.4,reb:3.7,ast:2.1,stl:.8,blk:.5,fg:.468,to:1.6,eligible:['SG']},
    {id:'durant',name:'Kevin Durant',pts:25.1,tpm:1.9,reb:8.3,ast:4.8,stl:1.1,blk:1.6,fg:.537,to:2.2,eligible:['SF','PF']},
    {id:'dray',name:'Draymond Green',pts:10.2,tpm:1.1,reb:7.9,ast:7.0,stl:2.0,blk:1.4,fg:.418,to:2.3,eligible:['PF','C']},
    {id:'zaza',name:'Zaza Pachulia',pts:6.1,tpm:0,reb:5.9,ast:1.9,stl:.9,blk:.3,fg:.535,to:1.4,eligible:['C']} ]},
  { team:'1995-96 Bulls ~', players:[
    {id:'jordan',name:'Michael Jordan',pts:30.4,tpm:1.1,reb:6.6,ast:4.3,stl:2.2,blk:.5,fg:.495,to:2.4,eligible:['SG','SF']},
    {id:'pippen',name:'Scottie Pippen',pts:19.4,tpm:1.5,reb:6.4,ast:5.9,stl:1.7,blk:.6,fg:.463,to:2.9,eligible:['SF','PF']},
    {id:'kukoc',name:'Toni Kukoc',pts:13.1,tpm:1.1,reb:4.0,ast:3.5,stl:.9,blk:.4,fg:.490,to:1.9,eligible:['SF','PF']},
    {id:'rodman',name:'Dennis Rodman',pts:5.5,tpm:0,reb:14.9,ast:2.5,stl:.6,blk:.4,fg:.480,to:1.7,eligible:['PF','C']},
    {id:'longley',name:'Luc Longley',pts:9.1,tpm:0,reb:5.1,ast:1.9,stl:.4,blk:1.0,fg:.482,to:2.0,eligible:['C']} ]},
];
const ALL = {}; ROSTERS.forEach(r=>r.players.forEach(p=>ALL[p.id]=p));

// ================= STATE =================
const SLOTS=['PG','SG','SF','PF','C'];
const empty=()=>({PG:null,SG:null,SF:null,PF:null,C:null});
let S = { spin:0, max:5, roster:null, usedRosters:new Set(), taken:new Set(), turn:null, pickIdx:0, sel:null,
          board:{you:empty(),opp:empty()}, budget:{you:100,opp:100}, done:false };

const firstPicker = n => (n%2===1)?'you':'opp';       // snake
const other = w => w==='you'?'opp':'you';

function spin(){
  // Prefer teams not yet used this draft. If we've run through them all
  // (only 3 placeholder rosters vs 5 spins), start a fresh cycle — but never
  // land on the team we're already showing, so it can't repeat back-to-back.
  let pool = ROSTERS.filter(r=>!S.usedRosters.has(r.team));
  if(pool.length===0){ S.usedRosters.clear(); pool = ROSTERS.filter(r=>r!==S.roster); }
  S.roster = pool[Math.floor(Math.random()*pool.length)];
  S.usedRosters.add(S.roster.team);
  S.spin++; S.pickIdx=0; S.turn=firstPicker(S.spin); S.sel=null; render();
}
function selectPlayer(id){ if(S.taken.has(id)) return; S.sel = (S.sel===id?null:id); render(); }
function sign(slot){
  const who=S.turn, p=ALL[S.sel];
  if(!p || S.board[who][slot] || price(p)>S.budget[who]) return;
  S.board[who][slot]=S.sel; S.budget[who]-=price(p); S.taken.add(S.sel); S.sel=null;
  if(S.pickIdx===0){ S.pickIdx=1; S.turn=other(who); }        // hand off to second picker
  else if(S.spin>=S.max){ S.done=true; }                       // draft complete
  render();
}
function full(who){ return SLOTS.every(s=>S.board[who][s]); }

// ================= RENDER =================
function boardHTML(who){
  const active = who===S.turn && !S.done && S.roster;
  const label = who==='you'?'YOU':'OPPONENT';
  const slots = SLOTS.map(slot=>{
    const pid=S.board[who][slot];
    if(pid) return `<div class="slot filled"><div class="pos">${slot}</div><div>${ALL[pid].name}</div>
      <div class="price">$${price(ALL[pid])}M</div></div>`;
    if(active && S.sel){
      const p=ALL[S.sel], v=placed(p,slot), can=price(p)<=S.budget[who];
      return `<div class="slot target ${can?'':'cant'}" ${can?`onclick="sign('${slot}')"`:''}>
        <div class="pos">${slot}</div><div class="val">${v.toFixed(3)}</div>
        <div class="price">$${price(p)}M ${can?'':'✗'}</div></div>`;
    }
    return `<div class="slot"><div class="pos">${slot}</div><div style="color:#bbb">open</div></div>`;
  }).join('');
  return `<div class="board ${active?'active':''}"><div class="head">
    <h2>${label}${active?' — picking':''}</h2><div>budget <span class="bud">$${S.budget[who]}M</span></div></div>
    <div class="slots">${slots}</div></div>`;
}

function centerHTML(){
  if(!S.roster) return `<div class="center"><h2>Shared wheel</h2>
    <p>Spin to reveal a team-season. Both players sign one player from it.</p>
    <button onclick="spin()">SPIN THE WHEEL</button></div>`;
  const cards = S.roster.players.map(p=>{
    const taken=S.taken.has(p.id), sel=S.sel===p.id;
    return `<div class="card ${taken?'taken':''} ${sel?'sel':''}" ${taken?'':`onclick="selectPlayer('${p.id}')"`}>
      <div class="nm">${p.name}</div><div class="el">${p.eligible.join('/')}</div>
      <div class="pr">$${price(p)}M</div>
      <div class="st">${p.pts}p ${p.reb}r ${p.ast}a · ${p.tpm}·3</div></div>`;
  }).join('');
  const turnLabel = `<span class="${S.turn}">${S.turn==='you'?'YOU':'OPPONENT'}</span> — pick ${S.pickIdx+1} of 2`;
  const canSpinNext = S.pickIdx===1 && S.board[other(S.turn)]; // both have picked when handoff done
  const bothPicked = SLOTS.filter(s=>S.board.you[s]).length + SLOTS.filter(s=>S.board.opp[s]).length === S.spin*2;
  let controls='';
  if(S.done){ controls=`<button onclick="finish()">SIMULATE MATCHUP</button>`; }
  else if(bothPicked && S.spin<S.max){ controls=`<button onclick="spin()">SPIN AGAIN (${S.spin}/${S.max})</button>`; }
  return `<div class="center"><div class="head"><h2>${S.roster.team}</h2>
    <div class="turn">NOW PICKING: ${turnLabel}</div></div>
    <div class="roster">${cards}</div>
    ${S.sel?`<p style="color:#0a7">Selected ${ALL[S.sel].name} — click a green slot on the ${S.turn==='you'?'YOU':'OPPONENT'} board to sign.</p>`:'<p style="color:#999">Click a player to sign.</p>'}
    <div>${controls}</div></div>`;
}

function finish(){
  const ts = who => SLOTS.reduce((s,slot)=> s + (S.board[who][slot]? placed(ALL[S.board[who][slot]],slot):0), 0);
  const a=ts('you'), b=ts('opp');
  const sa=Math.round(70+a*18), sb=Math.round(70+b*18);
  document.getElementById('app').innerHTML =
    `<div class="result"><span style="color:#0a7">YOU ${sa}</span> — <span style="color:#b26b00">${sb} OPP</span></div>
     <p>Your strength ${a.toFixed(3)} vs ${b.toFixed(3)}. ${a>=b?'You win.':'You lose.'}</p>
     <button onclick="location.reload()">NEW DRAFT</button>`;
}

function render(){
  document.getElementById('app').innerHTML =
    boardHTML('opp') + centerHTML() + boardHTML('you');
}
render();
</script>
