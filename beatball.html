<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeatBall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<script src="beatball-data.js"></script>
<style>
  :root{
    --ink:#0E1116; --paper:#EDEFF2; --card:#FFF; --line:#DCE0E6; --mute:#79828E;
    --ball:#EC5C1E; --blue:#2f6bff; --good:#1E9E6A; --ok:#C7A020; --bad:#D6483B;
    --disp:"Barlow Condensed",system-ui,sans-serif; --hype:"Bungee",system-ui,sans-serif; --body:"Barlow",-apple-system,sans-serif;
  }
  *{ box-sizing:border-box; } body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); }
  #app{ max-width:440px; margin:0 auto; min-height:100vh; padding-bottom:24px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px;
    position:sticky; top:0; background:var(--paper); z-index:5; border-bottom:1px solid var(--line); }
  .brand{ font-family:var(--hype); font-size:19px; } .brand b{ color:var(--ball); }
  .spins{ font-family:var(--disp); font-weight:700; font-size:13px; color:var(--mute); letter-spacing:.08em; }

  .opp{ padding:8px 16px 10px; }
  .opprow{ display:flex; gap:5px; align-items:center; }
  .oplabel{ font-family:var(--disp); font-weight:700; font-size:11px; letter-spacing:.1em; color:var(--mute); width:60px; flex:none; }
  .chip{ flex:1; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px; text-align:center; min-height:40px; }
  .chip .p{ font-family:var(--disp); font-weight:700; font-size:10px; color:var(--mute); }
  .chip .ov{ font-family:var(--hype); font-size:12px; } .chip .nm{ font-size:9px; line-height:1.05; }
  .chip.empty .nm,.chip.empty .ov{ color:#C4C9D0; }
  .budget{ font-family:var(--disp); font-weight:700; font-size:12px; color:var(--mute); text-align:right; margin-top:4px; }
  .budget b{ color:var(--ink); }

  .stage{ padding:6px 16px 14px; }
  .turn{ text-align:center; font-family:var(--disp); font-weight:700; letter-spacing:.06em; font-size:14px; margin:6px 0 10px; }
  .turn .you{ color:var(--ball); }
  .teamcard{ background:var(--ink); color:#fff; border-radius:12px; padding:14px 12px 8px; }
  .teamcard .season{ font-family:var(--disp); font-weight:700; font-size:12px; letter-spacing:.14em; color:#8892a0; }
  .teamcard .tname{ font-family:var(--hype); font-size:22px; line-height:1.02; margin:2px 0 12px; }
  .roster{ display:flex; flex-direction:column; gap:6px; }
  .player{ display:flex; align-items:center; gap:10px; background:#191F28; border:1px solid #262E3A;
    border-radius:9px; padding:7px 10px; cursor:pointer; }
  .player.sel{ border-color:var(--ball); background:#2A2015; }
  .player.taken{ opacity:.32; } .player.taken .nm{ text-decoration:line-through; }
  .ovrbadge{ font-family:var(--hype); font-size:17px; width:38px; text-align:center; flex:none; line-height:1; }
  .ovrbadge small{ display:block; font-family:var(--disp); font-size:7px; letter-spacing:.1em; color:#8892a0; }
  .ovrbadge.gold{ color:#FFD23F; } .ovrbadge.silver{ color:#CBD4DE; } .ovrbadge.bronze{ color:#D69A5B; } .ovrbadge.base{ color:#93a0b0; }
  .player .info{ flex:1; min-width:0; }
  .player .nm{ font-weight:600; font-size:14px; } .player .meta{ font-size:11px; color:#8892a0; }
  .player .pos{ color:var(--ball); font-family:var(--disp); font-weight:700; }
  .player .price{ font-family:var(--hype); font-size:15px; text-align:right; flex:none; }
  .player .price.cheap{ color:#4ee39a; }

  .spinbtn{ display:block; width:100%; margin:12px 0 0; padding:14px; border:none; border-radius:10px;
    background:var(--ball); color:#fff; font-family:var(--hype); font-size:15px; letter-spacing:.04em; cursor:pointer; }
  .spinbtn.ghost{ background:transparent; color:var(--ball); border:2px solid var(--ball); }
  .hint{ text-align:center; color:var(--mute); font-size:12px; margin-top:10px; min-height:16px; }

  .mine{ padding:4px 16px 0; }
  .mylabel{ font-family:var(--disp); font-weight:700; font-size:11px; letter-spacing:.1em; color:var(--mute); }
  .slots{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:6px; }
  .slot{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 3px; min-height:62px;
    text-align:center; display:flex; flex-direction:column; justify-content:center; }
  .slot .pos{ font-family:var(--disp); font-weight:700; font-size:11px; color:var(--mute); }
  .slot.filled{ border-color:var(--ink); } .slot .fill{ font-size:10px; font-weight:700; margin-top:2px; }
  .slot .tag{ font-family:var(--disp); font-weight:700; font-size:11px; margin-top:2px; }
  .slot.fit{ cursor:pointer; }
  .slot.fit0{ border-color:var(--good); background:#EAF7F1; } .slot.fit0 .tag{ color:var(--good); }
  .slot.fit1{ border-color:#7EBF57; background:#F1F8EC; } .slot.fit1 .tag{ color:#5a9e3a; }
  .slot.fit2{ border-color:var(--ok); background:#FBF6E6; } .slot.fit2 .tag{ color:#b8791b; }
  .slot.fit3{ border-color:#E0762A; background:#FDF0E6; } .slot.fit3 .tag{ color:#b8791b; }
  .slot.fit4{ border-color:var(--bad); background:#FBECEA; } .slot.fit4 .tag{ color:var(--bad); }
  .slot.cant{ border-color:var(--line)!important; background:#F4F4F5!important; cursor:not-allowed; opacity:.6; }

  /* result: matchup reveal (dark) */
  .reveal{ background:#07080C; color:#fff; min-height:100vh; padding:18px 14px 30px;
    background:radial-gradient(120% 55% at 50% 0%, #16202E 0%, #07080C 60%); }
  .rvtop{ text-align:center; } .rvlab{ font-family:var(--disp); font-weight:700; letter-spacing:.2em; font-size:12px; color:#8892a0; }
  .score{ font-family:var(--hype); font-size:54px; line-height:1; display:flex; justify-content:center; gap:14px; align-items:center; }
  .score .you{ color:#FF7A2F; } .score .riv{ color:#39B6FF; } .score .sep{ color:#3a424e; font-size:32px; }
  .rvteams{ display:flex; justify-content:space-between; font-family:var(--disp); font-weight:700; font-size:13px; margin:2px 6px; }
  .rvteams .you{ color:#FF7A2F; } .rvteams .riv{ color:#39B6FF; }
  svg{ width:100%; height:auto; display:block; }
  .verdict{ text-align:center; font-family:var(--hype); font-size:22px; margin:2px 0 14px; }
  .verdict.win{ color:#FF7A2F; } .verdict.lose{ color:#39B6FF; }
  .edges{ display:flex; flex-direction:column; gap:6px; }
  .edge{ display:flex; align-items:center; gap:8px; background:#10161F; border:1px solid #1d2836; border-radius:9px; padding:8px 11px; }
  .edge .axis{ flex:1; font-family:var(--disp); font-weight:700; font-size:13px; letter-spacing:.04em; }
  .edge .bars{ flex:none; width:110px; height:8px; border-radius:4px; display:flex; overflow:hidden; background:#0a0d12; }
  .edge .by{ background:#FF7A2F; } .edge .br{ background:#39B6FF; }
  .edge .who{ font-family:var(--hype); font-size:11px; width:30px; text-align:right; }
  .edge .who.you{ color:#FF7A2F; } .edge .who.riv{ color:#39B6FF; }
  .edge.big{ border-color:#F25C05; } .edge.big .axis::after{ content:" 🔥"; }
  .fade{ animation:fade .35s ease; } @keyframes fade{ from{opacity:0;transform:translateY(6px)} to{opacity:1} }
  @media (prefers-reduced-motion:reduce){ .fade{ animation:none; } }
</style>
<div id="app"></div>

<script>
// ===== load data =====
const DATA = window.BEATBALL_DATA;
if(!DATA){ document.getElementById('app').innerHTML =
  '<p style="padding:24px;font-family:sans-serif">Could not load <b>beatball-data.js</b> — make sure it sits in the same folder as this file.</p>'; }

const CFG = DATA.config;
const TEAMS = DATA.teams;
const ALL={}; TEAMS.forEach(t=>t.players.forEach(p=>ALL[p.id]=p));

// ===== engine =====
const W={pts:.2,tpm:.1,reb:.1,ast:.2,stl:.118,blk:.118,fg:.045,to:.118};
const AN={pts:[28,6],tpm:[3,0],reb:[12,2],ast:[9,1],stl:[2,.4],blk:[2.2,.2],fg:[.56,.4],to:[1,4]};
const SI={PG:1,SG:2,SF:3,PF:4,C:5}, PEN=[1,.8,.6,.4,.25];
const nz=(v,[e,r])=>Math.max(0,Math.min(1,(v-r)/(e-r)));
const strength=p=>{let s=0;for(const k in W)s+=W[k]*nz(p.stats[k],AN[k]);return s;};
const distTo=(p,slot)=>Math.min(...p.eligible.map(e=>Math.abs(SI[e]-SI[slot])));
const placed=(p,slot)=>strength(p)*PEN[distTo(p,slot)];
const price=p=>Math.round(p.capPct*CFG.budget);
const ovr=p=>Math.round(58+strength(p)*60);
const tier=o=>o>=90?'gold':o>=80?'silver':o>=72?'bronze':'base';
const isCheap=p=>strength(p)/price(p)*100>3.0;

// ===== state =====
const empty=()=>({PG:null,SG:null,SF:null,PF:null,C:null});
let S={ spin:0, roster:null, used:new Set(), taken:new Set(), turn:null, pick:0, sel:null,
        board:{you:empty(),rival:empty()}, budget:{you:CFG.budget,rival:CFG.budget}, done:false };
const first=n=>n%2===1?'you':'rival', other=w=>w==='you'?'rival':'you';
function spin(){
  let pool=TEAMS.filter(t=>!S.used.has(t.id));
  if(!pool.length){ S.used.clear(); pool=TEAMS.filter(t=>t!==S.roster); }
  S.roster=pool[Math.floor(Math.random()*pool.length)]; S.used.add(S.roster.id);
  S.spin++; S.pick=0; S.turn=first(S.spin); S.sel=null; render();
}
function selectPlayer(id){ if(S.taken.has(id))return; S.sel=(S.sel===id?null:id); render(); }
function sign(slot){ const who=S.turn,p=ALL[S.sel];
  if(!p||S.board[who][slot]||price(p)>S.budget[who])return;
  S.board[who][slot]=S.sel; S.budget[who]-=price(p); S.taken.add(S.sel); S.sel=null;
  if(S.pick===0){ S.pick=1; S.turn=other(who); } else if(S.spin>=CFG.spins){ S.done=true; }
  render();
}
const bothPicked=()=>CFG.slots.filter(s=>S.board.you[s]).length+CFG.slots.filter(s=>S.board.rival[s]).length===S.spin*2;
const last=n=>n.split(' ').slice(-1);

// ===== reveal math (team profile radar) =====
const AXES=['SCORING','SHOOTING','PLAYMAKING','REBOUNDING','DEFENSE','BALL CTRL'];
function profile(ids){ const P=ids.map(i=>ALL[i]); const sum=k=>P.reduce((a,p)=>a+p.stats[k],0);
  const sc=(v,lo,hi)=>Math.max(0,Math.min(100,Math.round((v-lo)/(hi-lo)*100)));
  return [ sc(sum('pts'),45,110), Math.round(.6*sc(sum('fg')/5,.43,.52)+.4*sc(sum('tpm'),2,14)),
    sc(sum('ast'),10,28), sc(sum('reb'),24,50), sc(sum('stl')+sum('blk'),6,15), sc(14-sum('to'),0,8) ]; }
function radarSVG(a,b){ const cx=200,cy=175,R=125,n=6;
  const pt=(i,v)=>{ const ang=-Math.PI/2+i*2*Math.PI/n, r=R*v/100; return [cx+r*Math.cos(ang),cy+r*Math.sin(ang)]; };
  const poly=pr=>pr.map((v,i)=>pt(i,v).join(',')).join(' ');
  let g=''; [25,50,75,100].forEach(r=>{ g+=`<polygon points="${AXES.map((_,i)=>pt(i,r).join(',')).join(' ')}" fill="none" stroke="#1c2530"/>`; });
  AXES.forEach((_,i)=>{ const[x,y]=pt(i,100); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#161d27"/>`; });
  const lab=AXES.map((ax,i)=>{ const[x,y]=pt(i,120); return `<text x="${x}" y="${y}" fill="#8892a0" font-family="Barlow Condensed" font-weight="700" font-size="12" text-anchor="middle" dominant-baseline="middle">${ax}</text>`; }).join('');
  return `<svg viewBox="0 0 400 350" role="img" aria-label="team comparison">${g}
    <polygon points="${poly(b)}" fill="#39B6FF22" stroke="#39B6FF" stroke-width="2.5"/>
    <polygon points="${poly(a)}" fill="#FF7A2F2b" stroke="#FF7A2F" stroke-width="2.5"/>${lab}</svg>`;
}

// ===== views =====
const $=id=>document.getElementById(id);
function badge(p){ const o=ovr(p); return `<div class="ovrbadge ${tier(o)}">${o}<small>OVR</small></div>`; }
function oppStrip(){ const chips=CFG.slots.map(s=>{ const id=S.board.rival[s];
  return id?`<div class="chip"><div class="p">${s}</div><div class="ov">${ovr(ALL[id])}</div><div class="nm">${last(ALL[id].name)}</div></div>`
           :`<div class="chip empty"><div class="p">${s}</div><div class="ov">–</div><div class="nm">—</div></div>`; }).join('');
  return `<div class="opp"><div class="opprow"><div class="oplabel">RIVAL</div>${chips}</div>
    <div class="budget">cap left <b>$${S.budget.rival}M</b></div></div>`; }
function stage(){
  if(!S.roster) return `<div class="stage"><div class="teamcard fade"><div class="season">THE WHEEL</div>
    <div class="tname">Spin to draft</div><div style="color:#8892a0;font-size:13px;margin-bottom:8px">A legendary roster drops. You each sign one — take his guy and he's gone.</div></div>
    <button class="spinbtn" id="spinBtn">SPIN THE WHEEL</button></div>`;
  const cards=S.roster.players.map(p=>{ const tk=S.taken.has(p.id),sel=S.sel===p.id,cheap=isCheap(p);
    return `<div class="player ${tk?'taken':''} ${sel?'sel':''}" data-pick="${p.id}">${badge(p)}
      <div class="info"><div class="nm">${p.name}</div><div class="meta"><span class="pos">${p.eligible.join('/')}</span> · ${p.stats.pts}p · ${p.stats.reb}r · ${p.stats.ast}a</div></div>
      <div class="price ${cheap&&!tk?'cheap':''}">$${price(p)}M${cheap&&!tk?' 🔥':''}</div></div>`; }).join('');
  const label=S.turn==='you'?'YOUR PICK':'RIVAL PICK';
  let ctrl=''; if(bothPicked()&&S.spin<CFG.spins) ctrl=`<button class="spinbtn" id="spinBtn">SPIN AGAIN · ${S.spin}/${CFG.spins}</button>`;
  const hint=S.sel?`Tap a slot below to sign ${last(ALL[S.sel].name)} — color = fit.`:(bothPicked()?'Both signed. Spin for the next team.':'Tap a player to sign him.');
  return `<div class="stage"><div class="turn"><span class="${S.turn==='you'?'you':''}">${label}</span> · pick ${S.pick+1} of 2</div>
    <div class="teamcard fade"><div class="season">${S.roster.season}</div><div class="tname">${S.roster.team}</div><div class="roster">${cards}</div></div>
    ${ctrl}<div class="hint">${hint}</div></div>`;
}
function myBoard(){ const active=!S.done&&S.roster;
  const slots=CFG.slots.map(slot=>{ const id=S.board.you[slot];
    if(id) return `<div class="slot filled"><div class="pos">${slot}</div><div class="fill">${last(ALL[id].name)}</div><div class="tag">${ovr(ALL[id])} OVR</div></div>`;
    if(active&&S.turn==='you'&&S.sel){ const p=ALL[S.sel],d=distTo(p,slot),can=price(p)<=S.budget.you;
      const tag=d===0?'ON FIT':('-'+Math.round((1-PEN[d])*100)+'%');
      return `<div class="slot fit fit${d} ${can?'':'cant'}" ${can?`data-slot="${slot}"`:''}><div class="pos">${slot}</div><div class="tag">${can?tag:'NO CAP'}</div></div>`; }
    return `<div class="slot"><div class="pos">${slot}</div><div class="fill" style="color:#C4C9D0">open</div></div>`; }).join('');
  return `<div class="mine"><div style="display:flex;justify-content:space-between;align-items:baseline">
    <div class="mylabel">YOUR STARTING FIVE</div><div class="budget">cap left <b>$${S.budget.you}M</b></div></div><div class="slots">${slots}</div></div>`;
}
function reveal(){
  const ids=w=>CFG.slots.map(s=>S.board[w][s]).filter(Boolean);
  const pY=profile(ids('you')), pR=profile(ids('rival'));
  const sY=CFG.slots.reduce((s,sl)=>s+(S.board.you[sl]?placed(ALL[S.board.you[sl]],sl):0),0);
  const sR=CFG.slots.reduce((s,sl)=>s+(S.board.rival[sl]?placed(ALL[S.board.rival[sl]],sl):0),0);
  const scoreY=Math.round(70+sY*18), scoreR=Math.round(70+sR*18), win=sY>=sR;
  const edges=AXES.map((ax,i)=>({ax,you:pY[i],riv:pR[i],m:Math.abs(pY[i]-pR[i])})).sort((a,b)=>b.m-a.m);
  const rows=edges.map((e,idx)=>{ const t=e.you+e.riv||1, who=e.you>=e.riv?'you':'riv', d=Math.abs(e.you-e.riv);
    return `<div class="edge ${idx===0?'big':''}"><div class="axis">${e.ax}</div>
      <div class="bars"><div class="by" style="width:${e.you/t*100}%"></div><div class="br" style="width:${e.riv/t*100}%"></div></div>
      <div class="who ${who}">+${d}</div></div>`; }).join('');
  return `<div class="reveal fade"><div class="rvtop"><div class="rvlab">FINAL</div>
    <div class="score"><span class="you">${scoreY}</span><span class="sep">·</span><span class="riv">${scoreR}</span></div></div>
    <div class="rvteams"><div class="you">▲ YOUR FIVE</div><div class="riv">RIVAL ▲</div></div>
    ${radarSVG(pY,pR)}<div class="verdict ${win?'win':'lose'}">${win?'YOU WIN':'YOU LOSE'}</div>
    <div class="edges">${rows}</div>
    <button class="spinbtn ghost" id="againBtn" style="margin-top:16px">NEW DRAFT</button></div>`;
}
function render(){
  if(!DATA) return;
  $('app').innerHTML = S.done
    ? reveal()
    : `<div class="topbar"><div class="brand">BEAT<b>BALL</b></div><div class="spins">SPIN ${S.spin||0}/${CFG.spins}</div></div>${oppStrip()}${stage()}${myBoard()}`;
  const sb=$('spinBtn'); if(sb) sb.addEventListener('click',spin);
  const ab=$('againBtn'); if(ab) ab.addEventListener('click',()=>location.reload());
  document.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>selectPlayer(el.dataset.pick)));
  document.querySelectorAll('[data-slot]').forEach(el=>el.addEventListener('click',()=>sign(el.dataset.slot)));
}
render();
</script>
