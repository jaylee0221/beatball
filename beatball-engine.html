<!doctype html>
<meta charset="utf-8">
<title>BeatBall — Engine (Layer 1)</title>
<style>
  /* Deliberately plain. This is a test harness, not the game's UI —
     the real design is YOUR job, later. Ugly on purpose. */
  body { font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace;
         max-width: 760px; margin: 32px auto; padding: 0 20px; color: #111; }
  h1 { font-size: 18px; } h2 { font-size: 14px; margin-top: 28px; color:#555;
       text-transform: uppercase; letter-spacing: .05em; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  th, td { text-align: right; padding: 4px 10px; border-bottom: 1px solid #eee; }
  th:first-child, td:first-child { text-align: left; }
  .note { background:#fffbe6; border-left:3px solid #e6c200; padding:8px 12px; margin:10px 0; }
  .score { font-size: 22px; margin: 8px 0; }
  .win { font-weight: 700; } .pen { color:#c0392b; } b { color:#000; }
</style>
<h1>BeatBall — Engine <small style="color:#999">(Layer 1: the judge)</small></h1>
<div id="out"></div>

<script>
// ============================================================
//  THE JUDGE — pure scoring/sim engine. No UI. No network.
//  Rosters in → result out. Everything below the CONFIG block
//  is machinery; everything IN the config block is your steering wheel.
// ============================================================

// ---------- CONFIG: where YOU steer the game ----------
const ANCHORS = {          // elite → 1.0, replacement → 0.0
  pts:{elite:28,repl:6}, reb:{elite:12,repl:2}, ast:{elite:9,repl:1},
  stl:{elite:2.0,repl:0.4}, blk:{elite:2.2,repl:0.2}, fg:{elite:0.560,repl:0.400},
  tpm:{elite:3.0,repl:0.0},  // threes made: COUNTING stat, low weight (it overlaps PTS)
  to:{elite:1.0,repl:4.0},  // TO: elite = FEW. Direction alone makes it count against.
};
const WEIGHTS = { pts:0.2, tpm:0.1, reb:0.1, ast:0.2, stl:0.118, blk:0.118, fg:0.045, to:0.118 }; // tuned
const PENALTY_BY_DISTANCE = [1.00, 0.80, 0.60, 0.40, 0.25]; // 0 / -20 / -40 / -60 / -75%
const SLOT_INDEX = { PG:1, SG:2, SF:3, PF:4, C:5 };
const SCORE_BASE = 70, SCORE_SCALE = 18; // strength → believable scoreline
// ------------------------------------------------------

const normalize = (v,{elite,repl}) => Math.max(0, Math.min(1, (v-repl)/(elite-repl)));

function playerStrength(p){
  const n = { pts:normalize(p.pts,ANCHORS.pts), reb:normalize(p.reb,ANCHORS.reb),
              ast:normalize(p.ast,ANCHORS.ast), stl:normalize(p.stl,ANCHORS.stl),
              blk:normalize(p.blk,ANCHORS.blk), fg:normalize(p.fg,ANCHORS.fg),
              tpm:normalize(p.tpm,ANCHORS.tpm),
              to:normalize(p.to,ANCHORS.to) };          // fewer TO → higher, via anchors
  let s=0; for(const k in WEIGHTS) s += WEIGHTS[k]*n[k];
  return { total:s, breakdown:n };
}
const distanceToSlot = (pl,slot) =>
  Math.min(...pl.eligible.map(pos => Math.abs(SLOT_INDEX[pos]-SLOT_INDEX[slot])));
const placedStrength = (pl,slot) => playerStrength(pl).total * PENALTY_BY_DISTANCE[distanceToSlot(pl,slot)];
const teamStrength = roster => roster.reduce((s,{player,slot}) => s+placedStrength(player,slot), 0);

function simulate(A,B){
  const sA=teamStrength(A), sB=teamStrength(B);
  return { sA, sB, scoreA:Math.round(SCORE_BASE+sA*SCORE_SCALE),
           scoreB:Math.round(SCORE_BASE+sB*SCORE_SCALE), winner: sA>=sB?'A':'B' };
}

// ---------- DEMO DATA: real, verified 2015-16 Cavaliers ----------
const P = {
  lebron:{name:'LeBron James',pts:25.3,reb:7.4,ast:6.8,stl:1.4,blk:0.6,fg:.520,tpm:1.1,to:3.3,eligible:['SF','PF']},
  kyrie:{name:'Kyrie Irving',pts:19.6,reb:3.0,ast:4.7,stl:1.1,blk:0.3,fg:.448,tpm:1.6,to:2.3,eligible:['PG']},
  love:{name:'Kevin Love',pts:16.0,reb:9.9,ast:2.4,stl:0.8,blk:0.5,fg:.419,tpm:2.1,to:1.8,eligible:['PF','C']},
  jrsmith:{name:'J.R. Smith',pts:12.4,reb:2.8,ast:1.7,stl:1.1,blk:0.3,fg:.415,tpm:2.6,to:0.8,eligible:['SG']},
  thompson:{name:'Tristan Thompson',pts:7.8,reb:9.0,ast:0.8,stl:0.5,blk:0.6,fg:.588,tpm:0.0,to:0.7,eligible:['C']},
};

// Same five. teamFit places them right; teamMisfit jams them into wrong slots.
const teamFit = [{player:P.kyrie,slot:'PG'},{player:P.jrsmith,slot:'SG'},{player:P.lebron,slot:'SF'},{player:P.love,slot:'PF'},{player:P.thompson,slot:'C'}];
const teamMisfit = [{player:P.thompson,slot:'PG'},{player:P.love,slot:'SG'},{player:P.kyrie,slot:'SF'},{player:P.jrsmith,slot:'PF'},{player:P.lebron,slot:'C'}];

// ---------- RENDER (the ONLY part that touches the screen) ----------
const out = document.getElementById('out');
const order = ['lebron','love','kyrie','thompson','jrsmith'];
out.innerHTML = `
  <h2>Player strength — the feel-test</h2>
  <table><tr><th>Player</th><th>Strength</th></tr>
    ${order.map(k=>`<tr><td>${P[k].name}</td><td><b>${playerStrength(P[k]).total.toFixed(3)}</b></td></tr>`).join('')}
  </table>
  <div class="note">Does this ranking match your gut? Notice Tristan Thompson (0.402) sitting almost
  even with Kyrie (0.416), and Love above both — that's low-usage bigs riding high FG% + clean
  turnovers, exactly the distortion we predicted. Tune <b>WEIGHTS</b> / <b>ANCHORS</b> at the top
  of this file to fix it, then reload.</div>

  <h2>Matchup — same players, fit vs misfit</h2>
  ${matchupTable(teamFit,'FIT')}
  ${matchupTable(teamMisfit,'MISFIT')}
  ${(() => { const r=simulate(teamFit,teamMisfit);
    return `<div class="score"><span class="${r.winner==='A'?'win':''}">FIT ${r.scoreA}</span> —
      <span class="${r.winner==='B'?'win':''}">${r.scoreB} MISFIT</span></div>
      <div>Identical talent. The entire ${(r.sA-r.sB).toFixed(3)} strength gap is <b>fit alone</b> —
      the position penalty doing its job.</div>`; })()}
`;

function matchupTable(roster,label){
  return `<table><tr><th>${label}</th><th>base</th><th>dist</th><th>×pen</th><th>placed</th></tr>
    ${roster.map(({player,slot})=>{
      const base=playerStrength(player).total, d=distanceToSlot(player,slot),
            pen=PENALTY_BY_DISTANCE[d], placed=base*pen;
      return `<tr><td>${slot}: ${player.name}</td><td>${base.toFixed(3)}</td>
        <td class="${d?'pen':''}">${d}</td><td class="${d?'pen':''}">${pen.toFixed(2)}</td>
        <td><b>${placed.toFixed(3)}</b></td></tr>`; }).join('')}
    <tr><td><b>Team</b></td><td colspan="3"></td><td><b>${teamStrength(roster).toFixed(3)}</b></td></tr>
  </table>`;
}
</script>
